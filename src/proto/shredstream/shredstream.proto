syntax = "proto3";

package shredstream;

import "google/protobuf/timestamp.proto";


message Header {
  google.protobuf.Timestamp ts = 1;
}


// Shredstream Proxy

service ShredstreamProxy {
  rpc SubscribeEntries(SubscribeEntriesRequest) returns (stream Entry);

  // Pre-parsed pump.fun launches: no transaction decoding on the consumer side.
  rpc SubscribePumpCreates(SubscribePumpCreatesRequest) returns (stream PumpCreate);

  // Buys the sniper fired, for the process that handles selling.
  rpc SubscribeFills(SubscribeFillsRequest) returns (stream Fill);
}

message SubscribeEntriesRequest {
  // tbd: we may want to add filters here
}

message Entry {
  // the slot that the entry is from
  uint64 slot = 1;

  // Serialized bytes of Vec<Entry>: https://docs.rs/solana-entry/latest/solana_entry/entry/struct.Entry.html
  bytes entries = 2;
}

message SubscribePumpCreatesRequest {
}

// One pump.fun token launch (`create` or `create_v2`), already parsed.
// All pubkey fields are raw 32-byte keys.
message PumpCreate {
  uint64 slot = 1;
  bytes mint = 2;
  bytes bonding_curve = 3;
  bytes associated_bonding_curve = 4;
  bytes creator = 5;
  bytes user = 6;
  bytes token_program = 7;
  uint64 dev_buy_lamports = 8;
  bytes signature = 9;
  bool is_v2 = 10;
  uint64 detected_at_micros = 11;
}

message SubscribeFillsRequest {
}

// A buy the sniper actually fired. The token account is created from a seed rather than
// being an ATA, so a seller cannot re-derive it without the seed.
message Fill {
  uint64 slot = 1;
  bytes mint = 2;
  bytes token_account = 3;
  string seed = 4;
  bytes token_program = 5;
  bytes bonding_curve = 6;
  bytes associated_bonding_curve = 7;
  bytes creator = 8;
  // expected token fill at the priced depth (instruction-independent; NOT the raw buy
  // arg0, which is sol_in under buy_exact_sol_in)
  uint64 amount = 9;
  // cost basis in LAMPORTS: the priced budget (instruction-independent; NOT the raw buy
  // arg1, which is a min-tokens floor under buy_exact_sol_in). The seller's stop-loss
  // multiple is computed against this.
  uint64 max_sol_cost = 10;
  uint64 fired_at_micros = 11;
}
